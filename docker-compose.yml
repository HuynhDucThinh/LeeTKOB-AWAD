services:
  postgres:
    image: postgres:16-alpine
    container_name: leetkob-postgres
    environment:
      POSTGRES_DB: leetkob
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - leetkob_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d leetkob"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leetkob_pgdata:
