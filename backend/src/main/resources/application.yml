server:
  address: ${SERVER_HOST:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: leetkob-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/leetkob}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/}

leetkob:
  role: ${LEETKOB_ROLE:all}
  sandbox:
    enabled: ${LEETKOB_SANDBOX_ENABLED:false}
    image: ${SANDBOX_IMAGE:leetkob-sandbox:latest}
