server:
  address: ${SERVER_HOST}
  port: ${SERVER_PORT}

spring:
  application:
    name: leetkob-backend
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

leetkob:
  role: ${LEETKOB_ROLE}
  checker:
    model-off: ${MODEL_OFF:false}
  sandbox:
    enabled: ${LEETKOB_SANDBOX_ENABLED}
    image: ${SANDBOX_IMAGE}
