# Test-only H2 in-memory configuration so unit and contract tests run without Docker/PostgreSQL.
spring.datasource.url=jdbc:h2:mem:leetkob;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=1000
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none

# Test-only fixture, NOT a secret. It lets the Spring context start in tests;
# PublishEndpointContractTest overrides AuthResolver with its own @Primary bean.
DEMO_AUTH_TOKEN=test-fixture-not-a-secret-000000000000000
